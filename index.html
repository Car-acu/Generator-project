<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,300..900;1,300..900&family=Schoolbell&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Schoolbell&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="src/style.css" />
    <title>Fun facts generator 🦔</title>
  </head>
  <body>
    <div class="container">
      <header>
        <h1>
          <span class="title1">It's</span> <span class="title2">learning</span>
          <span class="title3">time</span> <span class="titleEmoji"></span>
        </h1>
      </header>

      <main>
        <form id="favouriteAnimal">
          <input
            type="text"
            placeholder="What's your favourite animal?"
            autofocus
            required
            autocomplete="off"
            id="inputAnimal"
          />
          <input type="submit" value="Tell me a fun fact!" id="submitButton" />
        </form>
        <br />
        <div id="output">
          <h2></h2>
          <h3>Can't wait to do some research 👀</h3>
          <p></p>
          <br />
        </div>
      </main>

      <footer>
        This page was coded by
        <a href="https://github.com/Car-acu" target="_blank">Caro Acuna</a>. It
        is
        <a href="https://github.com/Car-acu/Generator-project" target="_blank"
          >open-sourced on Github</a
        >
        and hosted on
        <a href="https://caracu-ai-generator.netlify.app/" target="_blank"
          >Netlify</a
        >
      </footer>
    </div>
    <script src="src/index.js"></script>
  </body>
</html>
